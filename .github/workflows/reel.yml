name: reel
# 3 reels a day, SAST 07:30, 12:30 and 18:30. Runs on GitHub's servers: no laptop, no Claude tokens.
on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Script id to render (blank = next in rotation)'
        required: false
      post:
        description: 'Post to Instagram (yes/no)'
        default: 'yes'
permissions:
  contents: write
concurrency:
  group: reel
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - name: Render
        run: python render/render.py --brand stolenvalour ${{ github.event.inputs.id && format('--id {0}', github.event.inputs.id) || '' }}
      - name: Publish to gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash publish/pages.sh
      - name: Post to Instagram
        if: github.event.inputs.post != 'no'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: python publish/post_ig.py
