name: reel
# 3 reels a day, owed at SAST 07:30, 12:30 and 18:30. Wakes hourly so a skipped GitHub schedule heals itself.
# Runs on GitHub's servers: no laptop, no Claude tokens.
on:
  schedule:
    - cron: '23 5-21 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Script id to render (blank = next in rotation)'
        required: false
      post:
        description: 'Post to Instagram (yes/no)'
        default: 'yes'
permissions:
  contents: write
concurrency:
  group: reel
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Due?
        id: due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python publish/due.py | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        if: steps.due.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1
      - uses: actions/setup-node@v4
        if: steps.due.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: reel/package-lock.json
      - name: Install
        if: steps.due.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          (cd reel && npm ci --no-audit --no-fund && npx remotion browser ensure)
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - name: Render
        if: steps.due.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          SLOT: ${{ steps.due.outputs.slot }}
          REEL_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.post == 'no' }}
        run: python render/render5.py --brand stolenvalour ${{ github.event.inputs.id && format('--id {0}', github.event.inputs.id) || '' }}
      - name: Publish to gallery
        if: steps.due.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash publish/pages.sh
      - name: Post to Instagram
        if: (steps.due.outputs.run == 'yes' && github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.post != 'no')
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: python publish/post_ig.py
